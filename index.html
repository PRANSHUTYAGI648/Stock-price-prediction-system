<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            text-align: center;
        }

        .result-box h2 {
            font-size: 1.1rem;
            color: #34d399;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📈 Stock Price Prediction</h1>

        <form method="POST">
            <div class="form-group">
                <label for="open">Open Price</label>
                <input type="number" step="any" id="open" name="open" placeholder="e.g. 150.25" required>
            </div>

            <div class="form-group">
                <label for="high">High Price</label>
                <input type="number" step="any" id="high" name="high" placeholder="e.g. 155.00" required>
            </div>

            <div class="form-group">
                <label for="low">Low Price</label>
                <input type="number" step="any" id="low" name="low" placeholder="e.g. 149.50" required>
            </div>

            <div class="form-group">
                <label for="volume">Volume</label>
                <input type="number" step="any" id="volume" name="volume" placeholder="e.g. 1200000" required>
            </div>

            <button type="submit">🔮 Predict Close Price</button>
        </form>

        {% if prediction is not none %}
        <div class="result-box">
            <h2>💰 Predicted Close Price: {{ "%.2f"|format(prediction) }}</h2>
        </div>
        {% endif %}
    </div>

</body>
</html>
